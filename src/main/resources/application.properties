spring.application.name=charity_hub
spring.data.mongodb.host=localhost
spring.data.mongodb.database=charity_db
spring.data.mongodb.username=admin
spring.data.mongodb.password=charity_password
spring.data.mongodb.port=27017
server.port=8080
cases-service.url=http://localhost:8081

# Feign client configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=full
logging.level.com.charity_hub.cases.shared.CasesClient=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.feign=DEBUG
logging.level.org.springframework.web=DEBUG

#management.datadog.metrics.export.apiKey
#logging.level.org.springframework.security=TRACE

auth.
accounts.admins=201260032636,201260032632,201260032631
firebase.service-account-path=./cert/adminsdk.json
firebase.test-mode=true
logging.structured.format.console=ecs
cases.initial-code=20039


# Logging
logging.level.root=INFO
logging.file.path=/var/log/charityhub
logging.file.name=/tmp/charityhub/spring-boot.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
#logging.pattern.file=%d{yyyy-MM-dd:ss.SSS} [%thread] %-5level %logger{36} [dd.trace_id=%X{dd.trace_id} dd.span_id=%X{dd.span_id}] - %msg%n
logging.pattern.file={"timestamp":"%d{yyyy-MM-dd:ss.SSS}","level":"%level","logger":"%logger","trace_id":"%X{dd.trace_id}","span_id":"%X{dd.span_id}","message":"%msg"}%n

# Micrometer & Datadog
management.datadog.metrics.export.apiKey=${DATADOG_API_KEY}
management.datadog.metrics.export.applicationKey=${DATADOG_APPLICATION_KEY}
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.descriptionsEnabled=true
management.datadog.metrics.export.uri=https://api.us5.datadoghq.com
logging.level.io.micrometer.datadog=INFO

#dd.env=local2
#dd.service=${DATADOG_SERVICE}
#dd.version=1.0.0
#dd.logs.injection=true
dd.trace.logs.injection=true
dd.tags=source:java,env:local,service:charityhub-service
